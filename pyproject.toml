[project]
name = "sonar-cnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oguzb", email = "hoguzbolat@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
sonar-cnn = "sonar_cnn:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
